version: 2

project_name: gheppo

before:
  hooks:
    - go mod tidy

builds:
  - id: gheppo
    main: .
    binary: gheppo
    env:
      - CGO_ENABLED=0
    # Default goreleaser ldflags target main.version, which does not exist in
    # this repo -- the version var lives in package cmd, so inject it there or
    # every release reports the hardcoded dev version.
    ldflags:
      - -s -w
      - -X github.com/dexisback/gheppo/cmd.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: dexisback
    name: gheppo
